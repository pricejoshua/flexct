<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FLEX Translation - Redirecting...</title>
  <script>
    // Redirect to index.html with flow view preference
    const hash = window.location.hash;
    const search = window.location.search;

    // Set view mode to mobile
    localStorage.setItem('flex_translation_view_mode', 'mobile');

    // Redirect to index.html with same hash/search
    window.location.href = 'index.html' + search + hash;
  </script>
</head>
<body>
  <p style="text-align: center; padding: 40px; font-family: sans-serif;">
    Redirecting to unified view...
  </p>
</body>
</html>
